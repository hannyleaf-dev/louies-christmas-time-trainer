<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louie's Christmas-tell-the-time-trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Tilt+Neon&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div id="garland" aria-hidden="true"></div>
  <div id="app">
    <header id="topbar" hidden>
      <button class="tb-btn" id="tb-home" aria-label="Home" data-say='["t_home"]'>🏠</button>
      <div id="star-track" aria-label="Stars today"></div>
      <div class="tb-right">
        <button class="tb-btn" id="tb-stickers" aria-label="Sticker book" data-say='["m_stickers"]'>📒</button>
        <button class="tb-btn" id="tb-full" aria-label="Full screen">⛶</button>
        <div id="tb-buddy"></div>
        <button class="gate-btn" id="tb-lock" aria-label="Grown-ups: press and hold">
          <span class="gate-fill"></span><span class="gate-label">🔒 Grown-ups</span>
        </button>
        <div class="lock-tip" id="lock-tip">Keep holding for 3 seconds…</div>
      </div>
    </header>
    <main id="screen"></main>
  </div>
  <div id="overlay"></div>
  <canvas id="confetti"></canvas>

  <script src="js/core.js"></script>
  <script src="js/xmas.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/mascots.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/parent.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
